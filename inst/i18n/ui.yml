rep_note_tests:
  en: "Mean (SD) and median [Q1, Q3] for numeric variables; n (%) of non-missing values for categorical ones. With groups, p-values come from the Wilcoxon rank-sum test (2 groups) or Kruskal-Wallis test (more groups) for numeric variables, and Fisher's exact test (2x2 or small counts) or the chi-squared test for categorical ones. They are descriptive aids, without adjustment for multiple comparisons."
  es: "Media (DE) y mediana [Q1, Q3] para variables numéricas; n (%) de los valores no faltantes para las categóricas. Con grupos, los valores p provienen de la prueba de suma de rangos de Wilcoxon (2 grupos) o Kruskal-Wallis (más grupos) en variables numéricas, y de la prueba exacta de Fisher (2x2 o frecuencias pequeñas) o ji cuadrada en categóricas. Son ayudas descriptivas, sin ajuste por comparaciones múltiples."

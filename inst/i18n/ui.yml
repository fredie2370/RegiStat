scr_intro:
  en: "Check which hospital file numbers appear on a reference list (for example, the hospital's list of patients with diabetes) and keep a log of reviews. File numbers are stored in a separate file, never in the registry."
  es: "Verifique qué números de expediente aparecen en una lista de referencia (por ejemplo, la lista del hospital de pacientes con diabetes) y lleve una bitácora de revisiones. Los números de expediente se guardan en un archivo aparte, nunca en el registro."
scr_privacy:
  en: "The file screening.sqlite contains real file numbers. Keep it in a restricted folder and never share or publish it."
  es: "El archivo screening.sqlite contiene números de expediente reales. Guárdelo en una carpeta de acceso restringido y nunca lo comparta ni lo publique."

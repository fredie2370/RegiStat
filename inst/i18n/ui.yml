meth_intro:
  en: "All analyses use the records currently in the registry. Calculated measures (BMI, eGFR, TyG index, complication counts) are derived on the fly and are never stored. Missing values are left out of each analysis (available cases); \"unknown\" answers count as missing. P-values are not adjusted for multiple comparisons unless stated, and no result should be read as confirmatory."
  es: "Todos los análisis usan los registros que hay en el registro. Las medidas calculadas (IMC, TFGe, índice TyG, conteos de complicaciones) se derivan al momento y nunca se guardan. Los valores faltantes se excluyen de cada análisis (casos disponibles); las respuestas \"desconocido\" cuentan como faltantes. Los valores p no se ajustan por comparaciones múltiples salvo que se indique, y ningún resultado debe leerse como confirmatorio."

meth_descriptive:
  en: "Descriptive statistics: numeric variables as mean (SD) and median (Q1 - Q3); categorical variables as n (%). Between groups, numeric variables are compared with Welch's t-test (two groups, approximately normal) or the Wilcoxon rank-sum test, ANOVA or Kruskal-Wallis (three or more groups); categorical variables with the chi-squared test, or Fisher's exact test when an expected count is below 5. Prevalences have exact Clopper-Pearson 95% confidence intervals."
  es: "Estadística descriptiva: variables numéricas como media (DE) y mediana (Q1 - Q3); categóricas como n (%). Entre grupos, las numéricas se comparan con la t de Welch (dos grupos, aproximadamente normales) o la prueba de suma de rangos de Wilcoxon, ANOVA o Kruskal-Wallis (tres o más grupos); las categóricas con la prueba de chi cuadrada, o la exacta de Fisher cuando alguna frecuencia esperada es menor que 5. Las prevalencias llevan intervalo de confianza exacto de Clopper-Pearson de 95%."

meth_normality:
  en: "Normality is assessed with the Shapiro-Wilk test (p > 0.05 is taken as approximately normal) together with histograms with the density curve and the theoretical normal curve. With few records the test has little power, so inspect the histograms."
  es: "La normalidad se evalúa con la prueba de Shapiro-Wilk (p > 0.05 se toma como aproximadamente normal) junto con histogramas con la curva de densidad y la curva normal teórica. Con pocos registros la prueba tiene poca potencia, por lo que conviene revisar los histogramas."

meth_bivariate:
  en: "Comparison with a yes/no outcome: numeric variables are summarised in each group and compared with Welch's t-test (approximately normal) or the Wilcoxon rank-sum (Mann-Whitney) test. Categorical variables are cross-tabulated with the outcome: chi-squared with continuity correction, or Fisher's exact test when an expected count is below 5; for 2x2 tables the crude odds ratio has a 95% interval (Wald for chi-squared, exact for Fisher)."
  es: "Comparación con un desenlace sí/no: las variables numéricas se resumen en cada grupo y se comparan con la t de Welch (aproximadamente normales) o la prueba de Wilcoxon (Mann-Whitney). Las categóricas se cruzan con el desenlace: chi cuadrada con corrección de continuidad, o exacta de Fisher cuando alguna frecuencia esperada es menor que 5; en tablas 2x2 la razón de momios cruda lleva intervalo de 95% (Wald para chi cuadrada, exacto para Fisher)."

meth_corr:
  en: "Correlations: Spearman (default), Pearson, or automatic (Pearson when both variables look normal) on the records with both values. P-values are adjusted over all pairs with the Holm method."
  es: "Correlaciones: Spearman (por defecto), Pearson o automática (Pearson cuando ambas variables parecen normales) con los registros que tienen ambos valores. Los valores p se ajustan sobre todos los pares con el método de Holm."

meth_regression:
  en: "Logistic regression: binary logistic model on complete cases. Yes/no predictors use \"no\" as reference. Optionally, backward elimination by AIC. Reported: crude and adjusted odds ratios with 95% Wald intervals, Nagelkerke R-squared, Hosmer-Lemeshow test (10 groups), variance inflation factors, and the AUC of the fitted probabilities with its DeLong interval and Youden cut-off. At least 10 events per estimated coefficient are advisable; selection by AIC makes p-values optimistic, so use the result as exploratory or validate it on other data. Variables that are consequences of the outcome (for example creatinine for kidney disease) should not be predictors."
  es: "Regresión logística: modelo logístico binario con casos completos. Los predictores sí/no usan \"no\" como referencia. Opcionalmente, eliminación hacia atrás por AIC. Se reportan razones de momios crudas y ajustadas con intervalos de Wald de 95%, R cuadrada de Nagelkerke, prueba de Hosmer-Lemeshow (10 grupos), factores de inflación de la varianza y el AUC de las probabilidades ajustadas con su intervalo de DeLong y su punto de corte de Youden. Conviene tener al menos 10 eventos por coeficiente estimado; la selección por AIC vuelve optimistas los valores p, por lo que el resultado es exploratorio o debe validarse con otros datos. Las variables que son consecuencia del desenlace (por ejemplo la creatinina para la enfermedad renal) no deben ser predictores."

meth_roc:
  en: "ROC analysis: for each biomarker and outcome, the area under the curve (AUC) with its DeLong 95% interval, read as outstanding (>= 0.90), excellent (>= 0.80), acceptable (>= 0.70), unsatisfactory (>= 0.60) or no discrimination. The cut-off maximises Youden's index (sensitivity + specificity - 1), with its sensitivity, specificity and predictive values. Cut-offs and accuracy are computed on the same data that found them, so they are optimistic, and predictive values depend on the prevalence in this sample. A biomarker that defines the outcome (eGFR and kidney disease) will discriminate well by construction."
  es: "Análisis ROC: para cada biomarcador y desenlace, el área bajo la curva (AUC) con su intervalo de DeLong de 95%, leída como sobresaliente (>= 0.90), excelente (>= 0.80), aceptable (>= 0.70), insatisfactoria (>= 0.60) o sin discriminación. El punto de corte maximiza el índice de Youden (sensibilidad + especificidad - 1), con su sensibilidad, especificidad y valores predictivos. Los puntos de corte y la exactitud se calculan con los mismos datos que los encontraron, por lo que son optimistas, y los valores predictivos dependen de la prevalencia en esta muestra. Un biomarcador que define el desenlace (TFGe y enfermedad renal) discrimina bien por construcción."


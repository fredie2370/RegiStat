# RegiStat data dictionary: cross-sectional type 2 diabetes (T2D) registry.
#
# This is an EXAMPLE template. Adapt names, ranges, units and labels to your
# own study. Quote choice values such as "yes" and "no": unquoted yes/no are
# read by YAML as TRUE/FALSE.
#
# The identifier must be a pseudonymised study code. Never use the hospital
# file number, name, initials, date of birth or any other direct identifier.
study:
  id: t2d
  version: "0.1.0"
  title:
    en: "Type 2 diabetes complications: cross-sectional registry"
    es: "Complicaciones de diabetes tipo 2: registro transversal"

variables:
  - name: record_id
    type: id
    required: true
    label: {en: "Study record code", es: "Código de registro del estudio"}
    description:
      en: "Pseudonymised code assigned by the study team. Not the hospital file number."
      es: "Código seudonimizado asignado por el equipo del estudio. No es el número de expediente."

  - name: visit_date
    type: date
    required: true
    label: {en: "Visit date", es: "Fecha de la visita"}
    description:
      en: "ISO format YYYY-MM-DD."
      es: "Formato ISO AAAA-MM-DD."

  - name: sex_at_birth
    type: categorical
    required: true
    label: {en: "Sex assigned at birth", es: "Sexo asignado al nacer"}
    description:
      en: "Sex as recorded at birth. Gender identity is not collected by this template; add a variable if it matters for your study."
      es: "Sexo registrado al nacer. Esta plantilla no recoge identidad de género; agregue una variable si es relevante para su estudio."
    choices:
      - {value: "female", label: {en: "Female", es: "Mujer"}}
      - {value: "male", label: {en: "Male", es: "Hombre"}}
      - {value: "intersex", label: {en: "Intersex / differences of sex development", es: "Intersexual / diferencias del desarrollo sexual"}}
      - {value: "unknown", label: {en: "Unknown", es: "Desconocido"}}

  - name: age_years
    type: integer
    required: true
    unit: "years"
    min: 18
    max: 110
    label: {en: "Age", es: "Edad"}

  - name: weight_kg
    type: numeric
    unit: "kg"
    min: 25
    max: 300
    label: {en: "Body weight", es: "Peso corporal"}

  - name: height_cm
    type: numeric
    unit: "cm"
    min: 100
    max: 230
    label: {en: "Height", es: "Estatura"}

  - name: systolic_bp_mmhg
    type: integer
    unit: "mmHg"
    min: 60
    max: 260
    label: {en: "Systolic blood pressure", es: "Presión arterial sistólica"}

  - name: diastolic_bp_mmhg
    type: integer
    unit: "mmHg"
    min: 30
    max: 160
    label: {en: "Diastolic blood pressure", es: "Presión arterial diastólica"}

  - name: hba1c_pct
    type: numeric
    unit: "%"
    min: 3
    max: 20
    label: {en: "Glycated haemoglobin (HbA1c)", es: "Hemoglobina glucosilada (HbA1c)"}

  - name: fasting_glucose_mgdl
    type: numeric
    unit: "mg/dL"
    min: 30
    max: 800
    label: {en: "Fasting glucose", es: "Glucosa en ayuno"}

  - name: creatinine_mgdl
    type: numeric
    unit: "mg/dL"
    min: 0.2
    max: 15
    label: {en: "Serum creatinine", es: "Creatinina sérica"}

  - name: triglycerides_mgdl
    type: numeric
    unit: "mg/dL"
    min: 20
    max: 3000
    label: {en: "Triglycerides", es: "Triglicéridos"}

  - name: heart_rate_bpm
    type: integer
    unit: "bpm"
    min: 30
    max: 220
    label: {en: "Heart rate", es: "Frecuencia cardiaca"}

  - name: respiratory_rate_rpm
    type: integer
    unit: "breaths/min"
    min: 6
    max: 60
    label: {en: "Respiratory rate", es: "Frecuencia respiratoria"}

  - name: total_cholesterol_mgdl
    type: numeric
    unit: "mg/dL"
    min: 50
    max: 600
    label: {en: "Total cholesterol", es: "Colesterol total"}

  - name: bun_mgdl
    type: numeric
    unit: "mg/dL"
    min: 2
    max: 200
    label: {en: "Blood urea nitrogen (BUN)", es: "Nitrógeno ureico en sangre (BUN)"}

  - name: urea_mgdl
    type: numeric
    unit: "mg/dL"
    min: 5
    max: 400
    label: {en: "Urea", es: "Urea"}

  - name: uric_acid_mgdl
    type: numeric
    unit: "mg/dL"
    min: 1
    max: 20
    label: {en: "Uric acid", es: "Ácido úrico"}

  - name: hypertension
    type: categorical
    label: {en: "Hypertension", es: "Hipertensión"}
    choices:
      - {value: "yes", label: {en: "Yes", es: "Sí"}}
      - {value: "no", label: {en: "No", es: "No"}}
      - {value: "unknown", label: {en: "Unknown", es: "Desconocido"}}

  - name: ckd
    type: categorical
    label: {en: "Chronic kidney disease", es: "Enfermedad renal crónica"}
    choices:
      - {value: "yes", label: {en: "Yes", es: "Sí"}}
      - {value: "no", label: {en: "No", es: "No"}}
      - {value: "unknown", label: {en: "Unknown", es: "Desconocido"}}

  - name: retinopathy
    type: categorical
    label: {en: "Diabetic retinopathy", es: "Retinopatía diabética"}
    choices:
      - {value: "yes", label: {en: "Yes", es: "Sí"}}
      - {value: "no", label: {en: "No", es: "No"}}
      - {value: "unknown", label: {en: "Unknown", es: "Desconocido"}}

  - name: heart_failure
    type: categorical
    label: {en: "Heart failure", es: "Insuficiencia cardiaca"}
    choices:
      - {value: "yes", label: {en: "Yes", es: "Sí"}}
      - {value: "no", label: {en: "No", es: "No"}}
      - {value: "unknown", label: {en: "Unknown", es: "Desconocido"}}

  - name: dialysis
    type: categorical
    label: {en: "Dialysis", es: "Diálisis"}
    choices:
      - {value: "yes", label: {en: "Yes", es: "Sí"}}
      - {value: "no", label: {en: "No", es: "No"}}
      - {value: "unknown", label: {en: "Unknown", es: "Desconocido"}}

  - name: copd
    type: categorical
    label: {en: "COPD", es: "EPOC"}
    choices:
      - {value: "yes", label: {en: "Yes", es: "Sí"}}
      - {value: "no", label: {en: "No", es: "No"}}
      - {value: "unknown", label: {en: "Unknown", es: "Desconocido"}}

  - name: amputation
    type: categorical
    label: {en: "Amputation (diabetes-related)", es: "Amputación (relacionada con diabetes)"}
    choices:
      - {value: "yes", label: {en: "Yes", es: "Sí"}}
      - {value: "no", label: {en: "No", es: "No"}}
      - {value: "unknown", label: {en: "Unknown", es: "Desconocido"}}

  - name: other_complications
    type: text
    label: {en: "Other complications", es: "Otras complicaciones"}
    description:
      en: "Free text. Do not write names or other identifiers."
      es: "Texto libre. No escriba nombres ni otros identificadores."

  - name: other_comorbidities
    type: text
    label: {en: "Other comorbidities", es: "Otras comorbilidades"}
    description:
      en: "Free text. Do not write names or other identifiers."
      es: "Texto libre. No escriba nombres ni otros identificadores."

# Cross-field rules. The expression must be TRUE when the row is valid.
rules:
  - id: bp_order
    expr: "diastolic_bp_mmhg < systolic_bp_mmhg"
    message:
      en: "Diastolic pressure must be lower than systolic pressure."
      es: "La presión diastólica debe ser menor que la sistólica."
